[project]
name = "yt-research-gui-whisper"
version = "0.1.0"
description = "Python helpers for the YT research GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper>=20250625",
]

[project.scripts]
yt-research-gui-whisper = "yt_research_gui_whisper.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
